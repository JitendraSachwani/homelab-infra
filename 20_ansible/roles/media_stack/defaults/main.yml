nas_ip: "10.0.0.20"
nas_media_export: "/media"

nas_mount_fstype: nfs
nas_mount_opts: rw,_netdev,noatime,nfsvers=4

data_root: /mnt/data
torrents_root: "{{ data_root }}/torrents"
usenet_root: "{{ data_root }}/usenet"
library_root: "{{ data_root }}/media"
media_categories:
  - movies
  - tv
  - music
data_dir_mode: "0775"

media_stack_dir: /opt/media-stack

servarr_apps:
  - name: radarr
    display_name: Radarr
    image: lscr.io/linuxserver/radarr:latest
    port: 7878
    url: http://radarr:7878
    config_file: "{{ media_stack_dir }}/config/radarr/config.xml"
    root_folder: "/data/media/movies"
    prowlarr_application: true
    recyclarr_supported: true

  - name: sonarr
    display_name: Sonarr
    image: lscr.io/linuxserver/sonarr:latest
    port: 8989
    url: http://sonarr:8989
    config_file: "{{ media_stack_dir }}/config/sonarr/config.xml"
    root_folder: "/data/media/tv"
    prowlarr_application: true
    recyclarr_supported: true

  - name: lidarr
    display_name: Lidarr
    image: lscr.io/linuxserver/lidarr:latest
    port: 8686
    url: http://lidarr:8686
    config_file: "{{ media_stack_dir }}/config/lidarr/config.xml"
    root_folder: "/data/media/music"
    prowlarr_application: true
    recyclarr_supported: false

  - name: prowlarr
    display_name: Prowlarr
    image: lscr.io/linuxserver/prowlarr:latest
    port: 9696
    url: http://prowlarr:9696
    config_file: "{{ media_stack_dir }}/config/prowlarr/config.xml"
    prowlarr_application: false
    recyclarr_supported: false

timezone: Asia/Kolkata
media_uid: 1000
media_gid: 1000

servarr_api_key: "{{ lookup('ansible.builtin.file', playbook_dir + '/../../keys/servarr_api_key') | trim }}"

qbittorrent_image: lscr.io/linuxserver/qbittorrent:latest
qbittorrent_port: 8080
qbittorrent_bittorrent_port: 6881
qbittorrent_url: http://qbittorrent:8080
qbittorrent_admin_username: admin
qbittorrent_admin_password: >-
  {{
    lookup(
      'ansible.builtin.file',
      playbook_dir + '/../../keys/qbittorrent_admin_pass'
    ) | trim
  }}
qbittorrent_api_key: >-
  {{
    lookup(
      'ansible.builtin.file',
      playbook_dir + '/../../keys/qbittorrent_api_key'
    ) | trim
  }}


tdarr_install_dir: "/opt/tdarr"
tdarr_node_name: "{{ inventory_hostname }}"
tdarr_server_ip: "10.0.5.1"
tdarr_server_port: 8266
tdarr_upgrade: false
