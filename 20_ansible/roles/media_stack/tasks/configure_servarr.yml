---
- name: Wait for {{ item.name }}
  wait_for:
    port: "{{ item.port }}"
    timeout: 60

- name: Wait for config.xml
  wait_for:
    path: "{{ item.config_file }}"
    timeout: 60

- name: Configure API key
  lineinfile:
    path: "{{ item.config_file }}"
    regexp: '^\s*<ApiKey>.*</ApiKey>'
    insertafter: '<Config>'
    line: "  <ApiKey>{{ servarr_api_key }}</ApiKey>"
  register: api_key_config
  no_log: true

- name: Configure external auth
  lineinfile:
    path: "{{ item.config_file }}"
    regexp: '^\s*<AuthenticationMethod>.*</AuthenticationMethod>'
    insertafter: '<Config>'
    line: '  <AuthenticationMethod>External</AuthenticationMethod>'
  register: auth_config

- name: Restart {{ item.name }}
  command:
    cmd: docker compose restart {{ item.name }}
    chdir: "{{ media_stack_dir }}"
  when: api_key_config.changed or auth_config.changed

- name: Wait for {{ item.name }} after restart
  wait_for:
    port: "{{ item.port }}"
    timeout: 60
  when: api_key_config.changed or auth_config.changed

- name: Get {{ item.name }} root folders
  ansible.builtin.uri:
    url: "http://localhost:{{ item.port }}/api/{{ item.api_version }}/rootfolder"
    method: GET
    headers:
      X-Api-Key: "{{ servarr_api_key }}"
  when: item.root_folder_supported
  register: root_folders

- name: Create {{ item.name }} root folder
  ansible.builtin.uri:
    url: "http://localhost:{{ item.port }}/api/{{ item.api_version }}/rootfolder"
    method: POST
    headers:
      X-Api-Key: "{{ servarr_api_key }}"
    body_format: json
    body:
      path: "{{ item.root_folder }}"
    status_code: 201
  when: 
    - item.root_folder_supported
    - root_folders.json | length == 0
    - root_folders.json | map(attribute='path') | list | length == 0

- name: Get {{ item.name }} media management config
  ansible.builtin.uri:
    url: "http://localhost:{{ item.port }}/api/{{ item.api_version }}/config/mediamanagement"
    method: GET
    headers:
      X-Api-Key: "{{ servarr_api_key }}"
  when: item.media_management_supported
  register: media_management

- name: Enable hardlinks for {{ item.name }}
  ansible.builtin.uri:
    url: "http://localhost:{{ item.port }}/api/{{ item.api_version }}/config/mediamanagement"
    method: PUT
    headers:
      X-Api-Key: "{{ servarr_api_key }}"
    body_format: json
    body: >-
      {{
        media_management.json
        | combine({
            'copyUsingHardlinks': true
          })
      }}
  when:
    - item.media_management_supported
    - media_management.json.copyUsingHardlinks is defined
    - not media_management.json.copyUsingHardlinks

- name: Get {{ item.name }} naming config
  ansible.builtin.uri:
    url: "http://localhost:{{ item.port }}/api/{{ item.api_version }}/config/naming"
    method: GET
    headers:
      X-Api-Key: "{{ servarr_api_key }}"
  when: item.naming_config_supported
  register: naming_config

- name: Enable {{ item.name }} media renaming
  ansible.builtin.uri:
    url: "http://localhost:{{ item.port }}/api/{{ item.api_version }}/config/naming"
    method: PUT
    headers:
      X-Api-Key: "{{ servarr_api_key }}"
    body_format: json
    body: >-
      {{
        naming_config.json
        | combine({
            (item.naming_config_key): true
          })
      }}
    status_code: 
      - 200
      - 202
  when:
    - item.naming_config_supported
    - naming_config.json[item.naming_config_key] is defined
    - not naming_config.json[item.naming_config_key]

- name: Get {{ item.name }} download clients
  ansible.builtin.uri:
    url: "http://localhost:{{ item.port }}/api/{{ item.api_version }}/downloadclient"
    method: GET
    headers:
      X-Api-Key: "{{ servarr_api_key }}"
  register: download_clients
  when: item.download_client_supported

- name: Configure qBittorrent download client for {{ item.name }}
  ansible.builtin.uri:
    url: "http://localhost:{{ item.port }}/api/{{ item.api_version }}/downloadclient"
    method: POST
    headers:
      X-Api-Key: "{{ servarr_api_key }}"
    body_format: json
    body:
      enable: true
      protocol: torrent
      priority: 1
      removeCompletedDownloads: true
      removeFailedDownloads: true
      name: qBittorrent
      implementation: QBittorrent
      configContract: QBittorrentSettings
      fields:
        - name: host
          value: qbittorrent
        - name: port
          value: "{{ qbittorrent_port }}"
        - name: useSsl
          value: false
        - name: username
          value: ""
        - name: password
          value: ""
        - name: "{{ item.download_client_category_field }}"
          value: "{{ item.download_client_category }}"
    status_code:
      - 200
      - 201
  when:
    - item.download_client_supported
    - >
      'qBittorrent' not in
      (
        download_clients.json
        | map(attribute='name')
        | list
      )
  # no_log: true
