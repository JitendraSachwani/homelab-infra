servarr_user_shell: /usr/sbin/nologin
servarr_install_root: /opt
servarr_data_root: /var/lib
servarr_upgrade: false
servarr_config_dir: "{{ servarr_data_root }}/{{ servarr_name }}/.config/{{ servarr_name | capitalize }}"
servarr_config_file: "{{ servarr_config_dir }}/config.xml"
# Default role input; callers such as media_mgmt pass the real key explicitly.
servarr_api_key: ""

# Required variables (contract)
#
# servarr_name          # sonarr | radarr | lidarr | prowlarr
# servarr_binary        # Sonarr | Radarr | Lidarr | Prowlarr
# servarr_download_url  # official wiki URL
# servarr_port          # 8989 / 7878 / 8686 / 9696
# servarr_api_key       # API key to set in config.xml
