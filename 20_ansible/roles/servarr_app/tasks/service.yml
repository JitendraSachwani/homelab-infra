- name: Install {{ servarr_name }} systemd service
  ansible.builtin.template:
    src: servarr.service.j2
    dest: "/etc/systemd/system/{{ servarr_name }}.service"
    mode: "0644"
  register: servarr_service_unit

- name: Reload systemd for {{ servarr_name }}
  ansible.builtin.systemd:
    daemon_reload: true
  when: servarr_service_unit.changed

- name: Enable and start {{ servarr_name }}
  ansible.builtin.systemd:
    name: "{{ servarr_name }}"
    enabled: true
    state: started

- name: Wait for {{ servarr_name }} to respond
  ansible.builtin.wait_for:
    port: "{{ servarr_port }}"
    timeout: 30

- name: Wait for {{ servarr_name }} config file
  ansible.builtin.wait_for:
    path: "{{ servarr_config_file }}"
    timeout: 30

- name: Ensure {{ servarr_name }} API key is configured
  ansible.builtin.lineinfile:
    path: "{{ servarr_config_file }}"
    regexp: '^\s*<ApiKey>.*</ApiKey>'
    insertafter: '<Config>'
    line: "  <ApiKey>{{ servarr_api_key }}</ApiKey>"
    owner: "{{ servarr_name }}"
    group: "{{ servarr_name }}"
    mode: "0644"
  register: servarr_api_key_config
  no_log: true
  when: servarr_api_key | length > 0

- name: Set {{ servarr_name }} to external authentication
  # Auth is delegated to an external OAuth provider such as Authentik.
  ansible.builtin.lineinfile:
    path: "{{ servarr_config_file }}"
    regexp: '^\s*<AuthenticationMethod>.*</AuthenticationMethod>'
    insertafter: '<Config>'
    line: "  <AuthenticationMethod>External</AuthenticationMethod>"
    owner: "{{ servarr_name }}"
    group: "{{ servarr_name }}"
    mode: "0644"
  register: servarr_authentication_method_config

- name: Restart {{ servarr_name }} after config change
  ansible.builtin.systemd:
    name: "{{ servarr_name }}"
    state: restarted
  when: >
    (servarr_api_key_config is defined and servarr_api_key_config.changed) or
    (servarr_authentication_method_config is defined and servarr_authentication_method_config.changed)

- name: Wait for {{ servarr_name }} after config change
  ansible.builtin.wait_for:
    port: "{{ servarr_port }}"
    timeout: 30
  when: >
    (servarr_api_key_config is defined and servarr_api_key_config.changed) or
    (servarr_authentication_method_config is defined and servarr_authentication_method_config.changed)
